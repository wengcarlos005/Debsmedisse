<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Debs me disse</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%230B1120'/%3E%3Ccircle cx='32' cy='32' r='26' fill='%23D4AF37'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%230F1432'/%3E%3Cpath d='M38.5 17a15.6 15.6 0 1 0 0 30 18.6 18.6 0 0 1 0-30z' fill='%23F0D98C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F172A;--bg2:#1E1B4B;--bg3:#141B34;--ouro:#D4AF37;--ouro-c:#F0D98C;--ouro-e:#8C7220;--creme:#F4EDE4;--creme-s:#C9C2BC;--rosa:#E8B4C4;--r:10px;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--creme);min-height:100vh;padding:0}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.login-box{background:var(--bg3);border:1px solid rgba(212,175,55,.15);border-radius:16px;padding:2rem;width:100%;max-width:360px;text-align:center}
.login-box h1{font-size:1.3rem;color:var(--ouro);margin-bottom:.3rem}
.login-box p{font-size:.82rem;color:var(--creme-s);margin-bottom:1.5rem}
.login-box input{width:100%;background:var(--bg);border:1px solid rgba(212,175,55,.25);border-radius:8px;padding:.65rem .8rem;color:var(--creme);font-size:.88rem;font-family:inherit;margin-bottom:.7rem}
.login-box input:focus{outline:none;border-color:var(--ouro)}
.login-box button{width:100%;background:var(--ouro);color:var(--bg);border:none;border-radius:8px;padding:.7rem;font-size:.9rem;font-weight:600;cursor:pointer;margin-top:.3rem}
.login-box button:hover{opacity:.88}
.login-err{color:var(--rosa);font-size:.8rem;margin-top:.5rem;display:none}

/* EDITOR */
.editor{display:none;max-width:680px;margin:0 auto;padding:1.2rem 1rem 6rem}
.editor h1{font-size:1.4rem;color:var(--ouro);margin-bottom:.2rem}
.editor>.sub{color:var(--creme-s);font-size:.82rem;margin-bottom:1.5rem}

.section{margin-bottom:1rem;border:1px solid rgba(212,175,55,.12);border-radius:var(--r);overflow:hidden}
.sec-head{background:var(--bg2);padding:.7rem 1rem;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.sec-head h2{font-size:.9rem;color:var(--ouro-c);font-weight:600;margin:0}
.sec-head .arr{color:var(--ouro);transition:transform .2s;font-size:1rem}
.section.closed .sec-body{display:none}
.section.closed .arr{transform:rotate(-90deg)}
.sec-body{padding:1rem;display:flex;flex-direction:column;gap:.8rem;background:var(--bg3)}

label{display:block;font-size:.72rem;color:var(--creme-s);margin-bottom:.25rem;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=email],input[type=password],textarea{width:100%;background:var(--bg);border:1px solid rgba(212,175,55,.2);border-radius:6px;padding:.5rem .65rem;color:var(--creme);font-size:.85rem;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--ouro)}
textarea{resize:vertical;min-height:55px}

.row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
@media(max-width:500px){.row{grid-template-columns:1fr}}

.price-grp{border:1px solid rgba(212,175,55,.08);border-radius:8px;padding:.7rem}
.price-grp h4{font-size:.8rem;color:var(--ouro);margin:0 0 .4rem;font-weight:600}
.price-row{display:grid;grid-template-columns:1fr 110px;gap:.4rem;margin-bottom:.35rem}

.item-card{border:1px solid rgba(212,175,55,.08);border-radius:8px;padding:.65rem;position:relative}
.del-btn{position:absolute;top:.4rem;right:.5rem;background:none;border:none;color:#E8B4C4;cursor:pointer;font-size:.75rem;opacity:.5}
.del-btn:hover{opacity:1}
.add-btn{background:none;border:1px dashed rgba(212,175,55,.25);color:var(--ouro);padding:.45rem;border-radius:6px;cursor:pointer;font-size:.8rem;width:100%;margin-top:.2rem}
.add-btn:hover{border-color:var(--ouro);background:rgba(212,175,55,.04)}

.bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid rgba(212,175,55,.15);padding:.7rem 1rem;display:flex;gap:.6rem;justify-content:center;z-index:10}
.bar button{padding:.6rem 1.5rem;border:none;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer}
.bar .save{background:var(--ouro);color:var(--bg)}
.bar .logout{background:var(--bg2);color:var(--ouro);border:1px solid rgba(212,175,55,.2)}
.bar .preview{background:var(--bg3);color:var(--creme);border:1px solid rgba(212,175,55,.15)}
.bar button:hover{opacity:.85}

.toast{position:fixed;bottom:4.5rem;left:50%;transform:translateX(-50%);padding:.55rem 1.2rem;border-radius:8px;font-size:.82rem;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.ok{background:#22c55e;color:#fff;opacity:1}
.toast.err{background:#ef4444;color:#fff;opacity:1}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <h1>Painel Admin</h1>
    <p>Debs me disse</p>
    <input type="email" id="loginEmail" placeholder="Seu email">
    <input type="password" id="loginSenha" placeholder="Senha" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Entrar</button>
    <p class="login-err" id="loginErr">Email ou senha incorretos.</p>
  </div>
</div>

<!-- EDITOR -->
<div class="editor" id="editor">
  <h1>Painel da Debs</h1>
  <p class="sub">Edite os textos do site e clique em Salvar.</p>
  <div id="sections"></div>
</div>

<div class="bar" id="bar" style="display:none">
  <button class="preview" onclick="window.open('/','_blank')">Ver site</button>
  <button class="save" onclick="doSave()">Salvar</button>
  <button class="logout" onclick="doLogout()">Sair</button>
</div>

<div class="toast" id="toast"></div>

<script src="js/supabase.js?v=22"></script>
<script src="js/config.js?v=22"></script>
<script>
let DATA = {};
let SESSION = null;

/* ====== HELPERS ====== */
function $(s){ return document.querySelector(s) }
function toast(msg, ok=true){
  const t=$('#toast'); t.textContent=msg;
  t.className='toast '+(ok?'ok':'err');
  setTimeout(()=>t.className='toast',3000);
}

/* ====== AUTH ====== */
async function doLogin(){
  const email = $('#loginEmail').value.trim();
  const senha = $('#loginSenha').value;
  if(!email||!senha) return;
  const res = await SupaDB.login(email, senha);
  if(!res || !res.access_token){
    $('#loginErr').style.display='block'; return;
  }
  localStorage.setItem('sb_token', res.access_token);
  SESSION = { token: res.access_token, user: res.user };
  showEditor();
}

function doLogout(){
  localStorage.removeItem('sb_token');
  SESSION = null;
  $('#loginWrap').style.display='flex';
  $('#editor').style.display='none';
  $('#bar').style.display='none';
}

async function checkSession(){
  SESSION = await SupaDB.getSession();
  if(SESSION) showEditor();
}

/* ====== EDITOR ====== */
async function showEditor(){
  $('#loginWrap').style.display='none';
  $('#editor').style.display='block';
  $('#bar').style.display='flex';

  // Load from Supabase or fallback to static CONFIG
  const remote = await SupaDB.loadConfig();
  DATA = remote || configToData(CONFIG);
  renderSections();
}

function configToData(c){
  return {
    marca: { ...c.marca },
    whatsapp: { ...c.whatsapp },
    hero: { eyebrow:c.hero.eyebrow, titulo:c.hero.titulo, subtitulo:c.hero.subtitulo, ctaPrimario:c.hero.ctaPrimario, ctaSecundario:c.hero.ctaSecundario },
    sobre: { eyebrow:c.sobre.eyebrow, titulo:c.sobre.titulo, par1:c.sobre.paragrafos[0], par2:c.sobre.paragrafos[1] },
    pilares: c.sobre.pilares.map(p=>({titulo:p.titulo, texto:p.texto, icone:p.icone})),
    servicos: c.servicos.itens.map(s=>({nome:s.nome, descricao:s.descricao, paraQuem:s.paraQuem, duracao:s.duracao, linhas:s.linhas.map(l=>({...l}))})),
    jornada: c.jornada.passos.map(p=>({titulo:p.titulo, texto:p.texto})),
    faq: c.faq.itens.map(f=>({...f})),
    depoimentos: c.depoimentos.lista.map(d=>({...d})),
    rodape: { ...c.rodape },
  };
}

function field(lbl, val, onInput, type){
  const w = document.createElement('div');
  w.innerHTML = `<label>${lbl}</label>`;
  const inp = type==='textarea' ? document.createElement('textarea') : document.createElement('input');
  if(type!=='textarea') inp.type='text';
  inp.value = val||'';
  if(type==='textarea') inp.textContent = val||'';
  inp.addEventListener('input', e=>onInput(e.target.value));
  w.appendChild(inp);
  return w;
}

function section(title, open, ...content){
  const s = document.createElement('div');
  s.className = 'section'+(open?'':' closed');
  s.innerHTML = `<div class="sec-head"><h2>${title}</h2><span class="arr">▼</span></div>`;
  s.querySelector('.sec-head').onclick = ()=> s.classList.toggle('closed');
  const body = document.createElement('div');
  body.className = 'sec-body';
  content.flat().filter(Boolean).forEach(c=>body.appendChild(c));
  s.appendChild(body);
  return s;
}

function renderSections(){
  const root = $('#sections');
  root.innerHTML = '';
  const D = DATA;

  // Marca
  root.appendChild(section('Marca e contato', true,
    field('Nome', D.marca.nome, v=>D.marca.nome=v),
    field('Título', D.marca.titulo, v=>D.marca.titulo=v),
    field('Tagline', D.marca.tagline, v=>D.marca.tagline=v),
    (() => { const r=document.createElement('div'); r.className='row';
      r.appendChild(field('WhatsApp (números)', D.whatsapp.numero, v=>D.whatsapp.numero=v));
      r.appendChild(field('WhatsApp (exibição)', D.whatsapp.exibicao, v=>D.whatsapp.exibicao=v));
      return r; })(),
  ));

  // Hero
  root.appendChild(section('Página inicial', false,
    field('Eyebrow', D.hero.eyebrow, v=>D.hero.eyebrow=v),
    field('Título (aceita HTML)', D.hero.titulo, v=>D.hero.titulo=v),
    field('Subtítulo', D.hero.subtitulo, v=>D.hero.subtitulo=v),
  ));

  // Sobre
  root.appendChild(section('Sobre', false,
    field('Título', D.sobre.titulo, v=>D.sobre.titulo=v),
    field('Parágrafo 1', D.sobre.par1, v=>D.sobre.par1=v, 'textarea'),
    field('Parágrafo 2', D.sobre.par2, v=>D.sobre.par2=v, 'textarea'),
  ));

  // Preços
  const svcs = D.servicos.map((s,si)=>{
    const g = document.createElement('div'); g.className='price-grp';
    g.innerHTML=`<h4>${s.nome}</h4>`;
    g.appendChild(field('Descrição', s.descricao, v=>D.servicos[si].descricao=v));
    g.appendChild(field('Duração', s.duracao, v=>D.servicos[si].duracao=v));
    s.linhas.forEach((l,li)=>{
      const pr = document.createElement('div'); pr.className='price-row';
      const i1=document.createElement('input'); i1.value=l.label; i1.oninput=e=>D.servicos[si].linhas[li].label=e.target.value;
      const i2=document.createElement('input'); i2.value=l.valor; i2.oninput=e=>D.servicos[si].linhas[li].valor=e.target.value;
      pr.appendChild(i1); pr.appendChild(i2); g.appendChild(pr);
    });
    return g;
  });
  root.appendChild(section('Leituras e preços', false, ...svcs));

  // Jornada
  const jor = D.jornada.map((j,i)=>{
    const r=document.createElement('div'); r.className='row';
    r.appendChild(field(`Passo ${i+1}`, j.titulo, v=>D.jornada[i].titulo=v));
    r.appendChild(field('Texto', j.texto, v=>D.jornada[i].texto=v));
    return r;
  });
  root.appendChild(section('Como funciona', false, ...jor));

  // FAQ
  const faqs = D.faq.map((f,i)=>{
    const c = document.createElement('div'); c.className='item-card';
    const del = document.createElement('button'); del.className='del-btn'; del.textContent='remover';
    del.onclick=()=>{D.faq.splice(i,1);renderSections()};
    c.appendChild(del);
    c.appendChild(field('Pergunta', f.p, v=>D.faq[i].p=v));
    c.appendChild(field('Resposta', f.r, v=>D.faq[i].r=v, 'textarea'));
    return c;
  });
  const addFaq = document.createElement('button'); addFaq.className='add-btn'; addFaq.textContent='+ Nova pergunta';
  addFaq.onclick=()=>{D.faq.push({p:'',r:''});renderSections()};
  faqs.push(addFaq);
  root.appendChild(section('FAQ', false, ...faqs));

  // Depoimentos
  const deps = D.depoimentos.map((d,i)=>{
    const c = document.createElement('div'); c.className='item-card';
    const del = document.createElement('button'); del.className='del-btn'; del.textContent='remover';
    del.onclick=()=>{D.depoimentos.splice(i,1);renderSections()};
    c.appendChild(del);
    c.appendChild(field('Texto', d.texto, v=>D.depoimentos[i].texto=v, 'textarea'));
    const r=document.createElement('div'); r.className='row';
    r.appendChild(field('Autor', d.autor, v=>D.depoimentos[i].autor=v));
    r.appendChild(field('Contexto', d.contexto, v=>D.depoimentos[i].contexto=v));
    c.appendChild(r);
    return c;
  });
  const addDep = document.createElement('button'); addDep.className='add-btn'; addDep.textContent='+ Novo depoimento';
  addDep.onclick=()=>{D.depoimentos.push({texto:'',autor:'',contexto:''});renderSections()};
  deps.push(addDep);
  root.appendChild(section('Depoimentos', false, ...deps));

  // Rodapé
  root.appendChild(section('Rodapé', false,
    field('Frase final', D.rodape.frase, v=>D.rodape.frase=v),
    field('Aviso legal', D.rodape.avisoLegal, v=>D.rodape.avisoLegal=v, 'textarea'),
  ));
}

/* ====== SAVE ====== */
async function doSave(){
  if(!SESSION){toast('Faça login primeiro.', false);return;}
  const ok = await SupaDB.saveConfig(DATA, SESSION.token);
  toast(ok ? 'Salvo! O site já está atualizado.' : 'Erro ao salvar. Tente de novo.', ok);
}

/* ====== INIT ====== */
if(SupaDB.isConfigured()) checkSession();
else {
  // Sem Supabase: mostra aviso
  document.querySelector('.login-box p').textContent = 'Supabase não configurado. Veja o guia de setup.';
}
</script>
</body>
</html>
